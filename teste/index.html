<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residência FONTE - Exposições</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #e9f0ea;
            --text-color: #1a1c1a;
            --link-color: #14401a;
            --font-highlight: 'Epilogue', sans-serif;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            padding-top: 100px; /* Espaço para o header fixo */
        }

        /* HEADER E LOGOTIPO */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background-color: transparent;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            box-sizing: border-box;
        }

        .logo {
            max-width: 150px;
            /* Inverte a cor de branco para preto */
            filter: invert(1) brightness(0); 
            display: block;
        }

        /* GRID */
        .grid-container {
            display: grid;
            gap: 30px 20px;
            grid-template-columns: repeat(2, 1fr);
        }

        @media (min-width: 1024px) {
            .grid-container {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .expo-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        /* Placeholder do Thumb (Aspect Ratio 4:3) */
        .thumb-placeholder {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: var(--link-color);
            margin-bottom: 12px;
        }

        .expo-title {
            font-family: var(--font-highlight);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin: 0 0 5px 0;
            line-height: 1.1;
        }

        .expo-artists {
            font-size: 0.8rem;
            opacity: 0.8;
            line-height: 1.3;
        }

        /* PAGINAÇÃO MINIMALISTA */
        .pagination {
            margin: 60px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: var(--font-main);
        }

        .pagination span, .pagination button {
            padding: 5px 10px;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
        }

        .pagination button:disabled {
            visibility: hidden; /* Oculta as setas quando não há página anterior/próxima */
        }

        .pagination .active {
            font-weight: bold;
            border-bottom: 2px solid var(--link-color);
        }

        .pagination .dots {
            cursor: default;
        }

    </style>
</head>
<body>

    <header id="main-header">
        <img src="https://umpedrogallego.github.io/site/feat/fonte/logo_fonte_branco.png" alt="Residência FONTE" class="logo">
    </header>

    <main>
        <div id="expo-grid" class="grid-container"></div>
        <div id="pagination-container" class="pagination"></div>
    </main>

    <script>
        let allExpos = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        // 1. Logica do Header (Sobe e Desce)
        let lastScrollTop = 0;
        const header = document.getElementById('main-header');

        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                header.style.transform = "translateY(-100%)"; // Esconde
            } else {
                header.style.transform = "translateY(0)"; // Mostra
            }
            lastScrollTop = scrollTop;
        });

        // 2. Busca de Dados
        async function fetchExpos() {
            try {
                const response = await fetch('https://umpedrogallego.github.io/site/feat/fonte/expo.json');
                allExpos = await response.json();
                renderUI();
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
            }
        }

        // 3. Renderização do Grid e Paginação
        function renderUI() {
            renderGrid();
            renderPagination();
        }

        function renderGrid() {
            const grid = document.getElementById('expo-grid');
            grid.innerHTML = "";

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = allExpos.slice(start, end);

            pageData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'expo-card';
                card.innerHTML = `
                    <div class="thumb-placeholder"></div>
                    <h3 class="expo-title">${item.TITULO || 'Sem Título'}</h3>
                    <p class="expo-artists">${item.ARTISTAS || ''}</p>
                `;
                grid.appendChild(card);
            });
        }

        function renderPagination() {
            const container = document.getElementById('pagination-container');
            container.innerHTML = "";
            
            const totalPages = Math.ceil(allExpos.length / itemsPerPage);

            // Botão Anterior (<)
            const prevBtn = document.createElement('button');
            prevBtn.innerText = "<";
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => goToPage(currentPage - 1);
            container.appendChild(prevBtn);

            // Lógica dos números (1, 2, 3... 10)
            for (let i = 1; i <= totalPages; i++) {
                // Mostra sempre a primeira, a última, e as páginas próximas à atual
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    const pageNum = document.createElement('span');
                    pageNum.innerText = i;
                    if (i === currentPage) pageNum.className = "active";
                    pageNum.onclick = () => goToPage(i);
                    container.appendChild(pageNum);
                } 
                // Adiciona reticências
                else if (i === currentPage - 2 || i === currentPage + 2) {
                    const dots = document.createElement('span');
                    dots.innerText = "...";
                    dots.className = "dots";
                    container.appendChild(dots);
                }
            }

            // Botão Próximo (>)
            const nextBtn = document.createElement('button');
            nextBtn.innerText = ">";
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => goToPage(currentPage + 1);
            container.appendChild(nextBtn);
        }

        function goToPage(page) {
            currentPage = page;
            renderUI();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        fetchExpos();
    </script>
</body>
</html>
