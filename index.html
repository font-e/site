<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residência FONTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset e Variáveis de Identidade Visual */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #e9f0ea;             /* Fundo sutil esverdeado */
            --text: #1a1c1a;           /* Texto escuro quase preto */
            --accent: #14401a;         /* Verde escuro institucional */
            --font-head: 'Epilogue', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Cabeçalho e Comportamento do Logo */
        header {
            width: 100%;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: clamp(160px, 100%, 280px);
            height: auto;
            display: block;
            filter: brightness(0) saturate(100%); 
        }

        /* Texto Informativo */
        .notice-text {
            font-family: var(--font-head);
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 50px;
            color: var(--text);
            opacity: 0.9;
        }

        /* Menu de Links Interativos */
        .links-navigation {
            width: 100%; 
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Grade para as Imagens Lado a Lado */
        .image-row {
            display: flex;
            flex-direction: row;
            gap: 16px;
            width: 100%;
            align-items: stretch; /* Garante que as colunas tenham a mesma altura */
        }

        /* --- CÁLCULO EXATO DE PROPORÇÃO DAS IMAGENS --- */
        
        .image-link:nth-child(1) {
            /* Imagem Esquerda: Open Call (800 x 566) */
            flex: calc(800 / 566) 1 0%; 
        }

        .image-link:nth-child(2) {
            /* Imagem Direita: Activity Report (800 x 540) */
            flex: calc(800 / 540) 1 0%; 
        }

        /* ---------------------------------------------- */

        .image-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--accent);
            font-family: var(--font-body);
            font-size: 0.8rem; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            gap: 10px;
            text-align: center;
        }

        /* Container que trava o tamanho da imagem e aplica a borda */
        .img-wrapper {
            width: 100%;
            flex: 1; /* Ocupa todo o espaço vertical disponível na sua respectiva coluna */
            border: 1px solid var(--accent);
            overflow: hidden; 
            display: flex;
        }

        /* Imagem com transição fluida */
        .img-wrapper img {
            width: 100%;
            height: 100%;
            /* O cover aqui preenche 100% da caixa, e como a caixa agora tem a exata proporção da imagem original, NADA será cortado */
            object-fit: cover; 
            display: block;
            transition: transform 0.4s ease;
        }

        /* Efeito de zoom no hover */
        .image-link:hover .img-wrapper img {
            transform: scale(1.03); 
        }

        /* Caixa de Contato Sem Botão */
        .contact-box {
            border: 1px solid var(--accent);
            padding: 16px 24px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            background: transparent;
        }

        .contact-box a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        .contact-box a:hover {
            text-decoration: underline;
        }

        /* Botão do Instagram */
        .nav-button {
            display: block;
            text-decoration: none;
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--accent);
            padding: 16px 24px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .nav-button:hover {
            background-color: var(--accent);
            color: var(--bg);
        }

        /* Rodapé Discreto */
        .footer {
            margin-top: 60px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        /* REGRAS PARA DESKTOP (Telas Maiores) */
        @media (min-width: 768px) {
            .container {
                max-width: 800px; 
            }

            header {
                margin-bottom: 50px;
            }

            .logo {
                width: 380px;
            }

            .nav-button, .contact-box {
                padding: 18px 30px;
                font-size: 0.9rem;
            }
            
            .image-link {
                font-size: 0.85rem;
                letter-spacing: 1.5px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="https://font-e.github.io/site/content/logo_fonte_preto.png" alt="Residência FONTE" class="logo">
        </header>

        <p class="notice-text">Site em manutenção</p>

        <nav class="links-navigation">
            
            <div class="image-row">
                <!-- Imagem 1: Open Call -->
                <a href="https://www.font-e.org/content/residency_original.pdf" class="image-link" target="_blank" title="Baixar PDF - Open Call">
                    <div class="img-wrapper">
                        <img src="https://www.font-e.org/content/residency.jpg" alt="Open Call - FONTE Residency Program">
                    </div>
                    <span>Open Call<BR>FONTE Residency Program</span>
                </a>

                <!-- Imagem 2: Activity Report -->
                <a href="https://www.font-e.org/content/activity_report_original.pdf" class="image-link" target="_blank" title="Baixar PDF - Activity Report">
                    <div class="img-wrapper">
                        <img src="https://www.font-e.org/content/activity_report.jpg" alt="Activity Report 2020 - 2026">
                    </div>
                    <span>Activity Report<BR>2020 - 2026</span>
                </a>
            </div>

            <!-- Contato -->
            <div class="contact-box">
                contato<a href="mailto:contato@font-e.org" title="Enviar e-mail">@</a>font-e.org
            </div>

            <!-- Instagram -->
            <a href="https://www.instagram.com/residenciafonte" class="nav-button" target="_blank" rel="noopener noreferrer" title="Visitar o perfil do Instagram">Instagram</a>
            
        </nav>

        <div class="footer">
            © 2026 Residência FONTE
        </div>
    </div>

</body>
</html>
