<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <style>
        {% include main.css %}
    </style>
</head>
<body>

    {% include header.html %}

    {{ content }}

    <div id="lightbox">
        <span class="lb-close" onclick="closeLightbox()">&times;</span>
        <div class="lb-carousel-inner" id="lb-content"></div>
    </div>

<script>
    const API_BASE = "https://api.github.com/repos/font-e/site/contents/img/webp/full/";
    const IMG_FULL_BASE = "https://font-e.github.io/site/img/webp/full/";
    const IMG_THUMB_BASE = "https://font-e.github.io/site/img/webp/thumbs/";

    let allExpos = [];
    let currentGallery = [];

async function init() {
    try {
        const res = await fetch('https://font-e.github.io/site/json/exposicoes.json');
        const data = await res.json();
        allExpos = data.filter(e => e.PASTA).sort((a, b) => new Date(b.INICIO) - new Date(a.INICIO));
        populateFilters();
        renderGrid(allExpos);

        // --- LÓGICA DE DEEP LINKING ---
        if (window.location.hash) {
            const slug = window.location.hash.substring(1); // Remove o '#'
            const index = allExpos.findIndex(e => e.PASTA === slug);
            if (index !== -1) {
                // Pequeno atraso para garantir que o grid foi montado no DOM
                setTimeout(() => toggleDrawer(allExpos[index], index, allExpos.length), 500);
            }
        }
    } catch (e) { console.error("Erro no JSON:", e); }
}

    // ESC só fecha o Lightbox
window.addEventListener('keydown', (e) => {
    // 1. Tecla ESC continua fechando o Lightbox
    if (e.key === "Escape") {
        closeLightbox();
    }

    // 2. Lógica para Setas do Teclado (Comportamento de Slide Único)
    const lb = document.getElementById('lightbox');
    if (lb && lb.style.display === 'flex') {
        if (e.key === "ArrowRight") {
            e.preventDefault(); // Impede o scroll nativo do navegador
            changeLBSlide(1);   // Avança uma imagem
        } else if (e.key === "ArrowLeft") {
            e.preventDefault(); // Impede o scroll nativo do navegador
            changeLBSlide(-1);  // Recua uma imagem
        }
    }
});

    // Fechar drawer clicando fora do grid
    window.addEventListener('click', (e) => {
        const drawer = document.getElementById('active-drawer');
        const grid = document.getElementById('expo-grid');
        // Se clicar fora do grid E fora de uma gaveta aberta
        if (drawer && !grid.contains(e.target) && !drawer.contains(e.target)) {
            closeDrawer();
        }
    });

    function populateFilters() {
        const years = [...new Set(allExpos.map(e => e.ANO))].sort((a,b) => b-a);
        const types = [...new Set(allExpos.map(e => e.TIPO))].filter(t => t);
        years.forEach(y => document.getElementById('filter-year').innerHTML += `<option value="${y}">${y}</option>`);
        types.forEach(t => document.getElementById('filter-type').innerHTML += `<option value="${t}">${t}</option>`);
        document.getElementById('filter-year').addEventListener('change', filterData);
        document.getElementById('filter-type').addEventListener('change', filterData);
        document.getElementById('search-input').addEventListener('input', filterData);
    }

function formatarDataRange(inicioStr, fimStr) {
    if (!inicioStr || !fimStr) return "";

    // Criamos as datas garantindo que o fuso horário não altere o dia (usando UTC)
    const d1 = new Date(inicioStr);
    const d2 = new Date(fimStr);

    const meses = [
        "janeiro", "fevereiro", "março", "abril", "maio", "junho",
        "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
    ];

    const dia1 = d1.getUTCDate();
    const mes1 = meses[d1.getUTCMonth()];
    const ano1 = d1.getUTCFullYear();

    const dia2 = d2.getUTCDate();
    const mes2 = meses[d2.getUTCMonth()];
    const ano2 = d2.getUTCFullYear();

    // Caso 3: Anos diferentes
    if (ano1 !== ano2) {
        return `de ${dia1} de ${mes1} de ${ano1} a ${dia2} de ${mes2} de ${ano2}`;
    }
    // Caso 2: Meses diferentes (mesmo ano)
    if (mes1 !== mes2) {
        return `de ${dia1} de ${mes1} a ${dia2} de ${mes2} de ${ano2}`;
    }
    // Caso 1: Mesmo mês e ano
    return `de ${dia1} a ${dia2} de ${mes1} de ${ano2}`;
}

    function filterData() {
        const y = document.getElementById('filter-year').value;
        const t = document.getElementById('filter-type').value;
        const s = document.getElementById('search-input').value.toLowerCase();
        const filtered = allExpos.filter(e => 
            (!y || e.ANO == y) && (!t || e.TIPO == t) && 
            (!s || e.TITULO.toLowerCase().includes(s) || e.ARTISTAS.toLowerCase().includes(s))
        );
        renderGrid(filtered);
    }

    function renderGrid(items) {
        const grid = document.getElementById('expo-grid');
        grid.innerHTML = '';
        items.forEach((expo, i) => {
            const card = document.createElement('div');
            card.className = 'expo-item';
            card.id = `card-${expo.PASTA}`;
            card.innerHTML = `
                <div class="thumb-container">
                    <img src="${IMG_THUMB_BASE}${expo.PASTA}/capa.webp" loading="lazy" onload="this.classList.add('loaded')" onerror="this.style.display='none'">
                </div>
                <div class="mini-title">${expo.TITULO}</div>
            `;
            // Clicar na imagem (card) abre ou fecha a gaveta
            card.onclick = (e) => { e.stopPropagation(); toggleDrawer(expo, i, items.length); };
            grid.appendChild(card);
        });
    }

async function toggleDrawer(expo, index, total) {
    const existing = document.getElementById('active-drawer');
    const isSame = existing && existing.dataset.slug === expo.PASTA;

    if (isSame) { closeDrawer(); return; }
    
    closeDrawer(); // Limpa drawer e classes active anteriores

    // ADICIONA A CLASSE ACTIVE NO ITEM CLICADO
    document.getElementById(`card-${expo.PASTA}`).classList.add('active');
    window.location.hash = expo.PASTA;

    const columns = window.innerWidth > 768 ? 4 : 2;
    const insertAfter = Math.min(Math.ceil((index + 1) / columns) * columns, total);

    const drawer = document.createElement('div');
    drawer.id = 'active-drawer';
    drawer.className = 'drawer';
    drawer.dataset.slug = expo.PASTA;
    drawer.style.display = 'block';

    // ... (restante do código de busca de imagens e innerHTML permanece igual)
    let images = [];
    try {
        const apiRes = await fetch(`${API_BASE}${expo.PASTA}`);
        const files = await apiRes.json();
        images = files.filter(f => f.name.endsWith('.webp')).map(f => `${IMG_FULL_BASE}${expo.PASTA}/${f.name}`);
    } catch (e) { console.warn("Erro API"); }
    currentGallery = images;

    let curadoriaHTML = "";
    const curador = expo.CURADORIA || "";
    const autor = expo["AUTOR TEXTO"] || "";
    if (curador && autor && curador.trim() === autor.trim()) {
        curadoriaHTML = `<p><b>Curadoria e texto crítico:</b> ${curador}</p>`;
    } else {
        if (curador) curadoriaHTML += `<p><b>Curadoria:</b> ${curador}</p>`;
        if (autor) curadoriaHTML += `<p><b>Texto crítico:</b> ${autor}</p>`;
    }

    drawer.innerHTML = `
        <div class="carousel">
            ${images.map((src, i) => `<img src="${src}" onclick="openLightbox(${i})">`).join('')}
        </div>
        <div class="drawer-text">
            <h2>${expo.TITULO}</h2>
            <p class="artistas">${expo.ARTISTAS}</p>
            ${curadoriaHTML}
            ${expo.RESUMO ? `<div class="resumo">${expo.RESUMO}</div>` : ''}
            <button class="btn-toggle" onclick="togglePanel('info')">INFO</button>
            ${expo["TEXTO CRÍTICO"] ? `<button class="btn-toggle" onclick="togglePanel('texto')">TEXTO</button>` : ''}
            <div id="info-panel" class="extra-panel">
                ${expo.INICIO ? `<p><b>Duração:</b> ${formatarDataRange(expo.INICIO, expo.FIM)}</p>` : ''}
                ${expo.ORGANIZAÇÃO ? `<p><b>Organização:</b> ${expo.ORGANIZAÇÃO}</p>` : ''}
                ${expo.PRODUCAO ? `<p><b>Produção:</b> ${expo.PRODUCAO}</p>` : ''}
                ${expo.REALIZACAO ? `<p><b>Realização:</b> ${expo.REALIZACAO}</p>` : ''}
            </div>
            <div id="texto-panel" class="extra-panel">${expo["TEXTO CRÍTICO"] || ''}</div>
        </div>
    `;

    const grid = document.getElementById('expo-grid');
    grid.insertBefore(drawer, grid.children[insertAfter]);

    setTimeout(() => {
        const headerHeight = document.getElementById('main-header').offsetHeight;
        const drawerRect = drawer.getBoundingClientRect();
        const absoluteDrawerTop = drawerRect.top + window.pageYOffset;
        window.scrollTo({ top: absoluteDrawerTop - headerHeight, behavior: 'smooth' });
    }, 100);
}

function closeDrawer() {
    const drawer = document.getElementById('active-drawer');
    if (drawer) {
        drawer.remove(); // Remove a gaveta do DOM [cite: 112]
        history.replaceState(null, null, ' '); 
    }
    
    // REMOVE A OPACIDADE: Procura todos os itens que têm a classe 'active' e remove-a
    document.querySelectorAll('.expo-item').forEach(el => {
        el.classList.remove('active');
    });
}

    function togglePanel(type) {
        const info = document.getElementById('info-panel');
        const text = document.getElementById('texto-panel');
        if (type === 'info') {
            info.style.display = info.style.display === 'block' ? 'none' : 'block';
            text.style.display = 'none';
        } else {
            text.style.display = text.style.display === 'block' ? 'none' : 'block';
            info.style.display = 'none';
        }
    }

// 1. Atualize a função openLightbox para incluir os botões no HTML
function openLightbox(index) {
    const lb = document.getElementById('lightbox');
    const content = document.getElementById('lb-content');
    
    // Adiciona as setas e o conteúdo
    lb.innerHTML = `
        <span class="lb-close" onclick="closeLightbox()">&times;</span>
        <button class="lb-arrow lb-prev" onclick="event.stopPropagation(); changeLBSlide(-1)">&#10094;</button>
        <button class="lb-arrow lb-next" onclick="event.stopPropagation(); changeLBSlide(1)">&#10095;</button>
        <div class="lb-carousel-inner" id="lb-content">
            ${currentGallery.map(src => `<div class="lb-slide"><img src="${src}"></div>`).join('')}
        </div>
    `;

    lb.style.display = 'flex';
    
    // Faz scroll para a imagem selecionada inicialmente
    const slides = lb.querySelector('.lb-carousel-inner').querySelectorAll('.lb-slide');
    slides[index].scrollIntoView();
}

// 2. Adicione esta nova função para navegar via setas
function changeLBSlide(direction) {
    const lb = document.getElementById('lightbox');
    // Como cada slide tem 100vw, movemos o scroll a largura total da janela
    lb.scrollBy({
        left: direction * window.innerWidth,
        behavior: 'smooth'
    });
}

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    init();
</script>
</body>
</html>
