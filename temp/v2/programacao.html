<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONTE - Programação</title>
  <meta name="description" content="Programação da Residência Artística FONTE com grid suíço de 12 colunas e visualização interativa.">
  <meta property="og:title" content="FONTE - Programação">
  <meta property="og:description" content="Programação da Residência Artística FONTE com grid suíço de 12 colunas e visualização interativa.">

  <!-- CSS Modular Unificado -->
  <link rel="stylesheet" href="./src/css/base.css">
  <link rel="stylesheet" href="./src/css/nav-hero.css">
  <link rel="stylesheet" href="./src/css/programacao.css">
</head>
<body>
  <!-- Filtro SVG Duótono Preciso (#ccfffe nos tons claros, preto nos escuros) -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
    <filter id="duotone-cyan" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0.2126 0.7152 0.0722 0 0
        0.2126 0.7152 0.0722 0 0
        0.2126 0.7152 0.0722 0 0
        0      0      0      1 0" result="gray" />
      <feComponentTransfer in="gray">
        <feFuncR type="table" tableValues="0.0 0.8" />
        <feFuncG type="table" tableValues="0.0 1.0" />
        <feFuncB type="table" tableValues="0.0 0.996" />
      </feComponentTransfer>
    </filter>
  </svg>

  <!-- CABEÇALHO: NAVEGAÇÃO À ESQUERDA + LOGO À DIREITA -->
  <header id="logo-controller">
    <nav class="header-nav-left" aria-label="Navegação Principal">
      <a href="./programacao.html" class="header-nav-btn is-active" id="nav-btn-programacao">PROGRAMAÇÃO</a>
      <a href="./index.html" class="header-nav-btn" id="nav-btn-atelies">ATELIÊS</a>
    </nav>
    <div class="logo-hero-wrap">
      <a href="#top" title="FONTE - Início">
        <img id="site-logo" src="https://www.font-e.org/content/logo_fonte_preto.png" alt="FONTE">
      </a>
    </div>
  </header>

  <div id="top"></div>

  <!-- CONTEÚDO PRINCIPAL: PROGRAMAÇÃO -->
  <main id="main-content">
    <section class="section-block" id="sec-programacao">
      <div id="programacao-grid-container">
        <!-- Injetado via JS -->
      </div>
    </section>
  </main>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <!-- JS Modular -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
