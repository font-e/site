<!DOCTYPE html>
<html lang="pt-BR" data-font="spline">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONTE de la FONTE</title>
  <meta name="description" content="Navegação completa e fluida entre Programação, Residência, Ateliês e Arquivo com grid suíço de 12 colunas.">
  <meta property="og:title" content="FONTE de la FONTE">
  <meta property="og:description" content="Navegação completa e fluida entre Programação, Residência, Ateliês e Arquivo com grid suíço de 12 colunas.">

  <!-- Fontes Oficiais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Modular Unificado + Design System Geral -->
  <link rel="stylesheet" href="./src/css/base.css">
  <link rel="stylesheet" href="./src/css/nav-hero.css">
  <link rel="stylesheet" href="./src/css/program.css">
  <link rel="stylesheet" href="./src/css/residencia.css">
  <link rel="stylesheet" href="./src/css/atelies.css">
  <link rel="stylesheet" href="./src/css/arq.css">
  <link rel="stylesheet" href="./src/css/geral.css">
</head>
<body>

  <!-- AS DUAS CAMADAS DA PADRONAGEM FIXAS NO FUNDO -->
  <canvas id="canvas-normal" class="canvas-layer"></canvas>
  <canvas id="canvas-highlight" class="canvas-layer"></canvas>

  <!-- CABEÇALHO: NAVEGAÇÃO À ESQUERDA + LOGO À DIREITA -->
  <header id="logo-controller">
    <nav class="header-nav-left header-nav-collapsible" aria-label="Navegação Principal" id="header-nav-left">
      <button type="button" class="header-nav-btn menu-toggle-btn" id="menu-toggle-btn" aria-expanded="false" aria-label="Menu de Navegação">
        <span class="menu-toggle-icon" id="menu-toggle-icon">≡</span>
      </button>
      <div class="header-nav-items" id="header-nav-items">
        <div class="nav-item-dropdown" id="nav-dropdown-programacao">
          <a href="#sec-programacao" class="header-nav-btn is-active" id="nav-btn-programacao">PROGRAMAÇÃO</a>
          <div class="header-subnav-menu" id="subnav-programacao" aria-label="Subseções de Programação">
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-prog-presente" data-target-sec="sec-programacao" data-prog-filter="PRESENTE">PRESENTE</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-prog-inscricoes" data-target-sec="sec-programacao" data-prog-filter="INSCRIÇÕES ABERTAS">INSCRIÇÕES ABERTAS</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-prog-proxima" data-target-sec="sec-programacao" data-prog-filter="PRÓXIMA">PRÓXIMA</button>
          </div>
        </div>

        <div class="nav-item-dropdown" id="nav-dropdown-residencia">
          <a href="#sec-residencia" class="header-nav-btn" id="nav-btn-residencia">RESIDÊNCIA</a>
          <div class="header-subnav-menu" id="subnav-residencia" aria-label="Subseções de Residência">
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-res-inscricoes" data-target-sec="sec-residencia" data-residencia-mod="inscricoes">INSCRIÇÕES</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-res-individual" data-target-sec="sec-residencia" data-residencia-mod="individual">INVESTIGAÇÃO INDIVIDUAL</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-res-coletiva" data-target-sec="sec-residencia" data-residencia-mod="coletiva">RESIDÊNCIA COLETIVA</button>
          </div>
        </div>

        <div class="nav-item-dropdown" id="nav-dropdown-atelies">
          <a href="#sec-atelies" class="header-nav-btn" id="nav-btn-atelies">ATELIÊS</a>
          <div class="header-subnav-menu" id="subnav-atelies" aria-label="Artistas Residentes dos Ateliês">
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-marcelo" data-target-sec="sec-atelies" data-artist-id="marcelo-amorim">MARCELO AMORIM</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-osi" data-target-sec="sec-atelies" data-artist-id="osi">ÓSI</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-luah" data-target-sec="sec-atelies" data-artist-id="luah-souza">LUAH SOUZA</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-caio" data-target-sec="sec-atelies" data-artist-id="caio-borges">CAIO BORGES</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-gustavo" data-target-sec="sec-atelies" data-artist-id="gustavo-prata">GUSTAVO PRATA</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-hudson" data-target-sec="sec-atelies" data-artist-id="hudson-senna">HUDSON SENNA</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-simone" data-target-sec="sec-atelies" data-artist-id="simone-fontana-reis">SIMONE FONTANA REIS</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-jorge" data-target-sec="sec-atelies" data-artist-id="jorge-feitosa">JORGE FEITOSA</button>
            <button type="button" class="header-nav-btn header-subnav-btn" id="subnav-btn-art-pedro" data-target-sec="sec-atelies" data-artist-id="pedro-gallego">PEDRO GALLEGO</button>
          </div>
        </div>

        <a href="#sec-arquivo" class="header-nav-btn" id="nav-btn-arquivo">ARQUIVO</a>
      </div>
    </nav>
    <div class="logo-hero-wrap">
      <a href="#top" title="FONTE - Início">
        <img id="site-logo" src="https://www.font-e.org/content/logo_fonte_preto.png" alt="FONTE">
      </a>
    </div>
  </header>

  <div id="top"></div>

  <!-- CONTEÚDO PRINCIPAL: PROGRAMAÇÃO, RESIDÊNCIA, ATELIÊS & ARQUIVO -->
  <main id="main-content">

    <!-- SEÇÃO PROGRAMAÇÃO -->
    <section class="section-block programacao-section" id="sec-programacao">
      <div class="section-hero-wrapper">
        <h1 class="section-hero-title">PROGRAMAÇÃO</h1>
        <div class="section-folder-tabs-header">
          <div class="section-folder-tabs-rail" id="programacao-facets-container">
            <!-- Injetado via JS -->
          </div>
        </div>
      </div>
      <div class="section-content-panel">
        <div id="programacao-grid-container">
          <!-- Injetado via JS -->
        </div>
      </div>
    </section>

    <!-- SEÇÃO RESIDÊNCIA -->
    <section class="section-block residencia-section" id="sec-residencia">
      <div class="section-hero-wrapper">
        <h2 class="section-hero-title">RESIDÊNCIA</h2>
        <div class="section-folder-tabs-header">
          <div class="section-folder-tabs-rail" id="residencia-modality-btns">
            <!-- Injetado via JS -->
          </div>
        </div>
      </div>

      <div class="section-content-panel">
        <div class="residencia-top-grid grid-12-master">
          <div class="residencia-intro-text" id="residencia-subtitulo">
            <!-- Injetado via JS -->
          </div>
          <div class="residencia-content-column" id="residencia-main-content-col">
            <!-- Injetado via JS -->
          </div>
        </div>

        <div class="residencia-gallery-horizontal hide-scrollbar" id="residencia-gallery">
          <!-- Injetado via JS -->
        </div>
      </div>
    </section>

    <!-- SEÇÃO ATELIÊS -->
    <section class="section-block atelies-section" id="sec-atelies">
      <div class="section-hero-wrapper">
        <h2 class="section-hero-title">ATELIÊS</h2>
      </div>
      <div class="section-content-panel">
        <div id="atelies-grid-container">
          <!-- Injetado via JS -->
        </div>
      </div>
    </section>

    <!-- SEÇÃO ARQUIVO -->
    <section class="section-block archive-section" id="sec-arquivo">
      <div class="section-hero-wrapper">
        <h2 class="section-hero-title">ARQUIVO</h2>
        <div class="section-folder-tabs-header">
          <div class="section-folder-tabs-rail" id="archive-facets-container">
            <!-- Injetado via JS -->
          </div>
        </div>
      </div>

      <div class="section-content-panel">
        <div id="search-tags-container" class="search-tags-container"></div>

        <div class="table-container">
          <!-- Cabeçalho da tabela de 12 colunas -->
          <div id="table-header-container"></div>
          <!-- Corpo da tabela (linhas do acervo com gavetas universais) -->
          <div id="table-body-container"></div>
          <!-- Rodapé da tabela (paginação) -->
          <div id="table-footer-container"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <!-- JS Modular -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
