<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferência Vetorial - FONTE</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #002424;
      color: #ccfffe;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Container de cada linha com 50px de espaçamento vertical */
    .row {
      display: flex;
      gap: 20px; /* 2px de gap entre as letras */
      margin-bottom: 20px;
      position: relative;
    }

    /* Rótulo da linha para facilitar a leitura */
    .row-label {
      position: absolute;
      left: -80px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.5;
    }

    /* Caixa da letra (Prancheta) */
    .letter-box {
      width: 120px;
      height: 120px;
      padding: 6px;
      background-color: rgba(204, 255, 254, 0.03); /* Fundo sutil para ver o limite de 1060px */
      position: relative;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    path {
      fill: none;
      stroke: #ccfffe;
      stroke-width: 2px; /* Um pouco mais espesso para a conferência */
      stroke-linecap: square;
      stroke-linejoin: miter;
      vector-effect: non-scaling-stroke;
    }

    /* Na sobreposição, deixamos os traços um pouco translúcidos para ver o cruzamento */
    .overlay path {
      stroke-opacity: 0.6;
    }
  </style>
</head>
<body>

  <div id="grid-container"></div>

  <script>
    // Os dados exatos gerados pelo script
    const fragments = {
      "e1": "M538.226 406.93V292.36M148.067 1025.09H911.422",
      "e2": "M900.11 292.36V34.91m11.31 990.18V774.72m-131.47 -367.79H538.23",
      "e3": "M900.11 34.91H148.07m763.35 739.81H538.23",
      "e4": "M538.23 774.72v-125.9h241.72m-631.88 -613.91v990.18",
      "e5": "M779.95 648.82V406.93m-241.72 -114.57h361.88",
      "f1": "M708.665 873.189H901.589M595.243 807.425v-202.6",
      "f2": "M408.68 604.827v202.6m186.56 -202.6h113.43",
      "f3": "M159.57 604.827h249.11m492.91 268.362V312.069",
      "f4": "M159.57 312.069V604.827m249.11 202.6h186.56",
      "f5": "M708.67 604.827V873.189m192.92 -561.12H159.57",
      "n1": "M681.805 463.52h-4.241L448.558 34.91H65.466",
      "n2": "M994.21 34.91H681.8m-616.33 990.18h312.41",
      "n3": "M994.21 1025.09V34.91m-312.41 0v428.61h-4.24",
      "n4": "M377.88 1025.09V546.97h4.24l257.28 478.12",
      "n5": "M639.4 1025.09h354.81m-928.74 -990.18v990.18",
      "o1": "M136.286 654.48q0 181.08 111.767 282.91 M485.88 531.06q15.256 -35.01 43.826 -35.01 29.368 0 44.707 35.36",
      "o2": "M248.05 937.39q111.765 101.85 281.66 101.85 M574.41 531.41q15.33 35.385 15.33 125.9m-18.1 134.11q-14.865 34.215 -41.93 34.22",
      "o3": "M813.28 365.21q-109.875 -103.98 -283.57 -103.97M248.69 364.5q-112.41 103.275 -112.4 289.98 M589.74 657.31q0 92.43 -18.1 134.11",
      "o4": "M529.71 1039.24q168.6 0 281.01 -99.73m112.41 -285.03q0 -185.3 -109.85 -289.27 M468.39 657.31h0q0 -86.115 17.49 -126.25",
      "o5": "M810.72 939.51q112.38 -99.72 112.41 -285.03m-393.42 -393.24q-168.615 0 -281.02 103.26 M529.71 825.64q-27.645 0 -42.82 -34.19 -18.495 -41.67 -18.5 -134.14h0",
      "t1": "M116.878 299.43h217.7m390.159 725.66V299.43",
      "t2": "M724.74 299.43h217.69V34.91",
      "t3": "M334.58 299.43v725.66",
      "t4": "M334.58 1025.09h390.16m-607.86 -990.18v264.52",
      "t5": "M942.43 34.91H116.88"
    };

    const letters = ['f', 'o', 'n', 't', 'e'];
    const container = document.getElementById('grid-container');

    // Linhas 1 a 5 (Variações isoladas)
    for (let v = 1; v <= 5; v++) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="row-label">V ${v}</div>`;
      
      letters.forEach(l => {
        const key = l + v;
        const box = document.createElement('div');
        box.className = 'letter-box';
        // Injeta o SVG com a viewBox original de 1060
        box.innerHTML = `<svg viewBox="0 0 1060 1060"><path d="${fragments[key]}"></path></svg>`;
        row.appendChild(box);
      });
      container.appendChild(row);
    }

    // Linha 6 (Sobreposição de todas as versões)
    const overlayRow = document.createElement('div');
    overlayRow.className = 'row overlay';
    overlayRow.innerHTML = `<div class="row-label">OVERLAY</div>`;
    
    letters.forEach(l => {
      const box = document.createElement('div');
      box.className = 'letter-box';
      
      // Concatena as 5 paths da mesma letra dentro de um único SVG
      let allPaths = '';
      for (let v = 1; v <= 5; v++) {
        allPaths += `<path d="${fragments[l + v]}"></path>`;
      }
      
      box.innerHTML = `<svg viewBox="0 0 1060 1060">${allPaths}</svg>`;
      overlayRow.appendChild(box);
    });
    
    container.appendChild(overlayRow);
  </script>
</body>
</html>
