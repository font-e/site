<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Stories - FONTE</title>
    <link rel="stylesheet" href="intro.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .preview-container {
            width: 100%;
            max-width: 360px; /* Proporção de preview no celular */
            aspect-ratio: 9 / 16;
            background: #aefffa;
            position: relative;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #storyCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Vídeo de fundo mantido oculto mas ativo na memória */
        #bgVideo {
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }
        
        #btnGerar { background-color: #002424; color: #aefffa; }
        #btnBaixar { background-color: #28a745; color: white; display: none; }
        #btnCompartilhar { background-color: #e1306c; color: white; display: none; }
        
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Elemento do vídeo modelo mantido oculto para servir de fonte para o Canvas -->
    <video id="bgVideo" src="src/img/stories.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>

    <div class="preview-container">
        <!-- Canvas oficial na resolução nativa do Story (1080x1920) -->
        <canvas id="storyCanvas" width="1080" height="1920"></canvas>
    </div>

    <div class="controls">
        <button id="btnGerar">Gerar Vídeo (5s)</button>
        <button id="btnBaixar">Baixar Vídeo (MP4)</button>
        <button id="btnCompartilhar">Compartilhar nos Stories</button>
    </div>

    <div id="status">Carregando assets...</div>

    <script>
        const canvas = document.getElementById('storyCanvas');
        const ctx = canvas.getContext('2d');
        const bgVideo = document.getElementById('bgVideo');
        const btnGerar = document.getElementById('btnGerar');
        const btnBaixar = document.getElementById('btnBaixar');
        const btnCompartilhar = document.getElementById('btnCompartilhar');
        const statusEl = document.getElementById('status');

        let imagemCarregada = null;
        let videoBlob = null;
        let mediaRecorder = null;
        let gravacaoAtiva = false;
        
        // Frequência de atualização: 12 FPS
        const fps = 12;
        const fpsInterval = 1000 / fps;
        let then = Date.now();

        // Configurações do evento "Volante: a ilusão do brilho"
        const tituloTexto = "Volante: a ilusão do brilho";
        const urlImagem = "https://corsproxy.io/?" + encodeURIComponent("https://firebrick-mallard-266745.hostingersite.com/media/pages/eventos/volante-a-ilusao-do-brilho/6a404f751a-1789686092/250523_fonte_023-2560x2560-q85.webp");

        // 1. CARREGAMENTO DOS ASSETS
       async function inicializar() {
    try {
        statusEl.innerText = "Carregando mídia...";

        // Força o vídeo a rodar
        bgVideo.play().catch(() => {});

        // Carrega a imagem sem travar o canvas por erro de CORS
        imagemCarregada = new Image();
        imagemCarregada.crossOrigin = "anonymous";
        imagemCarregada.src = urlImagem;

        await new Promise((resolve) => {
            imagemCarregada.onload = resolve;
            imagemCarregada.onerror = () => {
                console.warn("Imagem não pôde ser carregada via CORS, prosseguindo sem ela.");
                resolve(); // Permite renderizar o fundo e o texto mesmo se a imagem falhar
            };
        });

        statusEl.innerText = "Pronto para gerar o vídeo.";
        iniciarLoopRenderizacao();

    } catch (erro) {
        statusEl.innerText = "Erro: " + erro.message;
        console.error(erro);
    }
}

        // Função utilitária para quebrar linha no Canvas com margens laterais
        function desenharTextoComQuebra(texto, x, y, maxWidth, lineHeight) {
            const palavras = texto.split(' ');
            let linha = '';
            let currentY = y;

            for (let n = 0; n < palavras.length; n++) {
                const testLine = linha + palavras[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(linha.trim(), x, currentY);
                    linha = palavras[n] + ' ';
                    currentY += lineHeight;
                } else {
                    linha = testLine;
                }
            }
            ctx.fillText(linha.trim(), x, currentY);
        }

        // 2. DESENHO DOS FRAMES NO CANVAS
        function desenharFrame() {
            // A. Desenha o fundo animado extraído do mp4 modelo
            if (bgVideo.readyState >= 2) {
                ctx.drawImage(bgVideo, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#aefffa";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // B. Desenha a Imagem (Centralizada abaixo do Logo, Y = ~480px)
            if (imagemCarregada) {
                const imgWidth = 960;
                const imgHeight = 640; // Proporção 1.5
                const imgX = (canvas.width - imgWidth) / 2;
                const imgY = 480; // Posicionada abaixo do espaço ocupado pelo logo

                ctx.save();
                ctx.drawImage(imagemCarregada, imgX, imgY, imgWidth, imgHeight);
                ctx.restore();
            }

            // C. Desenha o Texto (#002424, Bold 700, Alinhado e Centralizado)
            ctx.save();
            ctx.fillStyle = "#002424";
            ctx.textAlign = "center";
            ctx.font = "700 58px Arial, sans-serif"; // Equivalente ao clamp configurado para 1080px
            
            // Margem lateral de 54px (proporcional aos 18px do layout original)
            const paddingLateral = 54;
            const maxLarguraTexto = canvas.width - (paddingLateral * 2);
            
            // Posição Y do texto abaixo da imagem
            const textoY = 1200;
            desenharTextoComQuebra(tituloTexto, canvas.width / 2, textoY, maxLarguraTexto, 72);

            ctx.restore();
        }

        // 3. LOOP DE RENDERIZAÇÃO A 12 FPS
        function iniciarLoopRenderizacao() {
            function loop() {
                requestAnimationFrame(loop);
                let now = Date.now();
                let elapsed = now - then;

                if (elapsed > fpsInterval) {
                    then = now - (elapsed % fpsInterval);
                    desenharFrame();
                }
            }
            loop();
        }

        // 4. GRAVAÇÃO E EXPORTAÇÃO EM MP4
        btnGerar.addEventListener('click', () => {
            if (gravacaoAtiva) return;
            gravacaoAtiva = true;
            btnGerar.innerText = "Gravando MP4 (5s)...";
            btnGerar.disabled = true;
            statusEl.innerText = "Renderizando vídeo...";

            // Captura o stream do Canvas em 12 FPS
            const stream = canvas.captureStream(12);

            // Seleciona o melhor mimeType para garantir a exportação em MP4
            let options = { mimeType: 'video/mp4;codecs=avc1' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                if (MediaRecorder.isTypeSupported('video/mp4')) {
                    options = { mimeType: 'video/mp4' };
                } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
                    options = { mimeType: 'video/webm;codecs=h264' };
                } else {
                    options = { mimeType: 'video/webm' };
                }
            }

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            const gravacoes = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    gravacoes.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                const mimeFinal = options.mimeType || 'video/mp4';
                videoBlob = new Blob(gravacoes, { type: mimeFinal });
                statusEl.innerText = "Vídeo MP4 gerado com sucesso!";

                btnGerar.innerText = "Gerar Novo Vídeo";
                btnGerar.disabled = false;
                btnBaixar.style.display = "inline-block";

                if (navigator.canShare) {
                    btnCompartilhar.style.display = "inline-block";
                }

                gravacaoAtiva = false;
            };

            mediaRecorder.start();

            // Grava exatos 5 segundos
            setTimeout(() => {
                mediaRecorder.stop();
            }, 5000);
        });

        // 5. DOWNLOAD E COMPARTILHAMENTO
        btnBaixar.addEventListener('click', () => {
            if (!videoBlob) return;
            const url = URL.createObjectURL(videoBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'stories_volante.mp4';
            a.click();
            URL.revokeObjectURL(url);
        });

        btnCompartilhar.addEventListener('click', async () => {
            if (!videoBlob) return;

            const file = new File([videoBlob], 'stories_volante.mp4', { type: 'video/mp4' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Compartilhar nos Stories',
                        text: 'Exposição Volante: a ilusão do brilho'
                    });
                    statusEl.innerText = "Compartilhamento iniciado!";
                } catch (err) {
                    statusEl.innerText = "Erro ao compartilhar: " + err.message;
                }
            } else {
                alert("Seu navegador não suporta compartilhamento direto de arquivos de vídeo.");
            }
        });

        // Inicia o processo
        inicializar();
    </script>
</body>
</html>
