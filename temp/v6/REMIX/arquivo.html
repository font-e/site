<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONTE</title>
  <meta name="description" content="FONTE — Residência Artística e Programação Contemporânea em São Paulo.">
  <meta property="og:title" content="FONTE">
  <meta property="og:description" content="FONTE — Residência Artística e Programação Contemporânea em São Paulo.">

  <!-- CSS Modular -->
  <link rel="stylesheet" href="./src/css/base.css">
  <link rel="stylesheet" href="./src/css/nav-hero.css">
  <link rel="stylesheet" href="./src/css/arquivo.css">
</head>
<body>
  <!-- Filtro SVG Duótono Padrão -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
    <filter id="duotone-cyan" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0.2126 0.7152 0.0722 0 0
        0.2126 0.7152 0.0722 0 0
        0.2126 0.7152 0.0722 0 0
        0      0      0      1 0" result="gray" />
      <feComponentTransfer in="gray">
        <feFuncR type="table" tableValues="0.0 0.8" />
        <feFuncG type="table" tableValues="0.0 1.0" />
        <feFuncB type="table" tableValues="0.0 0.996" />
      </feComponentTransfer>
    </filter>
  </svg>

  <!-- CABEÇALHO -->
  <header id="logo-controller">
    <nav class="header-nav-left" aria-label="Navegação Principal">
      <a href="programacao.html" class="header-nav-btn" id="nav-btn-programacao">PROGRAMAÇÃO</a>
      <a href="residencia.html" class="header-nav-btn" id="nav-btn-residencia">RESIDÊNCIA</a>
      <a href="atelies.html" class="header-nav-btn" id="nav-btn-atelies">ATELIÊS</a>
      <a href="index.html" class="header-nav-btn is-active" id="nav-btn-arquivo">ARQUIVO</a>
    </nav>
    <div class="logo-hero-wrap">
      <a href="index.html" title="FONTE - Início">
        <img id="site-logo" src="https://www.font-e.org/content/logo_fonte_preto.png" alt="FONTE">
      </a>
    </div>
  </header>

  <div id="top"></div>

  <!-- CONTEÚDO PRINCIPAL: ARQUIVO -->
  <main id="main-content">
    <section class="section-block archive-section" id="sec-arquivo">
      <div class="archive-header-wrapper grid-12">
        <h2 class="archive-section-title">Arquivo</h2>
      </div>
      
      <div id="search-tags-container" class="search-tags-container"></div>
      
      <div class="table-container">
        <!-- Container de facetas (injetado via JS) -->
        <div id="archive-facets-container"></div>
        <!-- Cabeçalho da tabela -->
        <div id="table-header-container"></div>
        <!-- Corpo da tabela (linhas e gavetas) -->
        <div id="table-body-container"></div>
        <!-- Rodapé da tabela (paginação) -->
        <div id="table-footer-container"></div>
      </div>
    </section>
  </main>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <!-- JS Modular com ativação do Grid Guia -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
